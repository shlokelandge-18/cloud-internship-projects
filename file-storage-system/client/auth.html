<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudVault - Secure Storage Authentication</title>
    <!-- Outfit Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- SVG Gradient Definition for Logo -->
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
        <linearGradient id="cyan-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="50%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#a855f7" />
        </linearGradient>
    </svg>

    <div class="auth-container">
        <div class="auth-card glass-panel">
            <div class="brand-header">
                <h1 class="brand-logo">
                    <!-- Cloud icon svg -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.5 19A3.5 3.5 0 0 0 21 15.5c0-2.79-2.54-4.5-5-4.5-.42-1.89-1.74-3.5-3.5-4.5A5.5 5.5 0 0 0 4 10.07A4.42 4.42 0 0 0 1 14c0 2.2 1.8 4 4 4"></path>
                        <path d="M12 12v6"></path>
                        <path d="m9 15 3-3 3 3"></path>
                    </svg>
                    CloudVault
                </h1>
                <p class="auth-subtitle" id="auth-subtitle">Sign in to access your secure drive</p>
            </div>

            <!-- Error Banner -->
            <div class="error-message" id="error-banner">
                <!-- Alert icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                <span id="error-text">An error occurred. Please try again.</span>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-wrapper">
                        <input class="form-input" type="text" id="username" placeholder="Enter your username" required autocomplete="username">
                        <!-- User icon -->
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <input class="form-input" type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                        <!-- Lock icon -->
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    </div>
                </div>

                <button class="btn-primary" type="submit" id="submit-btn">Sign In</button>
            </form>

            <div class="auth-toggle">
                <span id="toggle-text">Don't have an account? </span>
                <span class="auth-link" id="toggle-link" onclick="toggleAuthMode()">Sign Up</span>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let isSignUpMode = false;

        // Check if already logged in, redirect to dashboard
        if (localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            
            const subtitle = document.getElementById('auth-subtitle');
            const submitBtn = document.getElementById('submit-btn');
            const toggleText = document.getElementById('toggle-text');
            const toggleLink = document.getElementById('toggle-link');
            const errorBanner = document.getElementById('error-banner');
            
            errorBanner.style.display = 'none';

            if (isSignUpMode) {
                subtitle.innerText = 'Create a secure cloud vault account';
                submitBtn.innerText = 'Register Account';
                toggleText.innerText = 'Already have an account? ';
                toggleLink.innerText = 'Sign In';
            } else {
                subtitle.innerText = 'Sign in to access your secure drive';
                submitBtn.innerText = 'Sign In';
                toggleText.innerText = "Don't have an account? ";
                toggleLink.innerText = 'Sign Up';
            }
        }

        async function handleAuth(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorBanner = document.getElementById('error-banner');
            const errorText = document.getElementById('error-text');
            const submitBtn = document.getElementById('submit-btn');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            errorBanner.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';

            const endpoint = isSignUpMode ? '/auth/register' : '/auth/login';

            try {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Authentication failed');
                }

                // Successful login or registration
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                // Redirect to main drive
                window.location.href = 'index.html';
            } catch (err) {
                errorText.innerText = err.message;
                errorBanner.style.display = 'flex';
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }
        }
    </script>
</body>
</html>
